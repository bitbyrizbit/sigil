<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Transparent background -->
  <!-- Outer seal ring in crisp white -->
  <circle cx="32" cy="32" r="28" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="6 2"/>
  <!-- Inner ring in crisp white -->
  <circle cx="32" cy="32" r="23" stroke="#FFFFFF" stroke-width="1.5" opacity="0.9"/>
  <!-- Flowing calligraphy S curve for sigil in crisp white -->
  <path d="M 40 18 C 36 14, 25 15, 24 23 C 23 30, 41 28, 40 37 C 39 46, 26 48, 22 43" 
        stroke="#FFFFFF" 
        stroke-width="3.5" 
        stroke-linecap="round"
        fill="none"/>
